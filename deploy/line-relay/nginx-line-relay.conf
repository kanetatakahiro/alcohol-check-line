# 【本番導入時・承認後】例：line.rebros.info（DNS設定とHTTPS証明書の取得が先に必要）
# LINE → https://line.rebros.info/line/webhook → 127.0.0.1:8787（中継）
server {
    listen 443 ssl;
    server_name line.rebros.info;
    ssl_certificate     /etc/letsencrypt/live/line.rebros.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/line.rebros.info/privkey.pem;
    client_max_body_size 1m;
    location = /line/webhook { proxy_pass http://127.0.0.1:8787; proxy_set_header X-Line-Signature $http_x_line_signature; }
    location / { return 404; }
}
