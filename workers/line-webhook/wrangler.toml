# 既存のLINE公式アカウント「REBIRTH 管理本部」の Webhook 受け口（LINE署名の確認つき・Cloudflare Workers 無料プラン）
# 導入（承認後）：シークレット LINE_CHANNEL_SECRET・EA_FORWARD_SECRET、テキスト EXISTING_GAS_URL・GAS_WEBAPP_URL・EA_GROUP_ID
name = "rebirth-line-webhook"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

[observability]
enabled = false   # 受信内容をCloudflareのログに残さない

# 転送できなかった分の一時保存と再送（5分ごと）
[[kv_namespaces]]
binding = "PENDING"
id = "（作成した KV 名前空間のID）"

[triggers]
crons = ["*/5 * * * *"]
